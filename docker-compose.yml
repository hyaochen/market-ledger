services:
  market-ledger:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: market-ledger
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/dev.db
      PORT: 3000
    volumes:
      - ./docker-data:/app/data

  market-ledger-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    container_name: market-ledger-bot
    mem_limit: 512m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/dev.db
      # 容器內連到 host 的 Ollama（Windows/Mac 用 host.docker.internal）
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # T-ML-024：LLM provider 切換。claude 走 owner 的 Pro/Max 訂閱額度（透過 host 上的
      # claude-bridge，見 scripts/claude-bridge/README.md），失敗時自動退回 ollama。
      LLM_PROVIDER: claude
      CLAUDE_BRIDGE_URL: http://host.docker.internal:5055
    volumes:
      - ./docker-data:/app/data
    depends_on:
      - market-ledger
    # 略過 next build，直接跑 bot
    command: ["node_modules/.bin/tsx", "bot/index.ts"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  market-ledger-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: market-ledger-tunnel
    restart: unless-stopped
    depends_on:
      - market-ledger
    command: tunnel --config /app/cloudflared-docker.yml run
    volumes:
      - ./cloudflared-docker.yml:/app/cloudflared-docker.yml:ro
      - ${CLOUDFLARED_DIR}:/etc/cloudflared:ro

