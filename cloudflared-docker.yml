# NOT MOUNTED / NOT USED since T-ML-037.
#
# The tunnel config is now generated by docker-compose.yml (top-level `configs:` ->
# cloudflared_config) from these .env keys, so the tunnel UUID and the public hostnames are
# not stored in this public repo:
#   TUNNEL_ID, CLOUDFLARED_DIR, TUNNEL_HOSTNAME_MAIN, TUNNEL_HOSTNAME_CASH
#
# This file only documents the resulting shape (placeholders, no real values).
tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: <TUNNEL_HOSTNAME_CASH>
    service: http://market-ledger:3000
  - hostname: <TUNNEL_HOSTNAME_MAIN>
    service: http://market-ledger:3000
  - service: http_status:404
